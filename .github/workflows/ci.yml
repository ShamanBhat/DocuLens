name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64): checks install, native deps and build there too.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Switch to `npm ci` (and add `cache: npm` above) once package-lock.json is committed.
      # onnxruntime-node (transitive, unused in the browser) would otherwise download large CUDA binaries on Linux.
      - run: npm install
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
